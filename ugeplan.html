<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ugeplan · Privat-assistent</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#17202a;background:#f4f6f7}*{box-sizing:border-box}body{margin:0}.wrap{max-width:780px;margin:auto;padding:18px 15px 70px}h1{font-size:2rem;margin:.2rem 0}.sub,.hint{color:#667085}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.btn{border:1px solid #d0d5dd;background:#fff;border-radius:9px;padding:9px 12px;font:inherit;cursor:pointer}.primary{background:#17202a;color:#fff}.weeknav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:18px 0}.day{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:14px;margin:10px 0}.day h2{font-size:1.05rem;margin:0 0 9px}.item{display:flex;align-items:center;gap:9px;padding:9px 0;border-top:1px solid #f0f1f3}.item:first-of-type{border-top:0}.itemmain{flex:1}.time{font-weight:700;margin-right:7px}.kind{font-size:.7rem;background:#eef2f6;border-radius:999px;padding:3px 7px}.remove{border:0;background:none;color:#9b1c1c;font-size:1.2rem}.add{display:grid;grid-template-columns:85px 1fr auto;gap:7px;margin-top:10px}.input{width:100%;border:1px solid #d0d5dd;border-radius:9px;padding:9px;font:inherit}.empty{color:#98a2b3;font-size:.85rem;padding:5px 0}.status{font-size:.82rem;color:#667085}.back{color:#17202a;text-decoration:none}</style></head><body><main class="wrap"><div class="top"><a class="back" href="/">← Handlingscentral</a><span class="status" id="status">Synkroniserer…</span></div><h1>Ugeplan</h1><p class="sub">Aftaler, faste opgaver og egne punkter samlet uge for uge.</p><div class="weeknav"><button class="btn" id="prev">← Forrige</button><b id="weekLabel"></b><button class="btn" id="next">Næste →</button></div><div id="days"></div></main><script>const API='https://privat-assistent.vercel.app/api/weekplan',names=['Mandag','Tirsdag','Onsdag','Torsdag','Fredag','Lørdag','Søndag'];let monday=startMonday(new Date()),items=[];function startMonday(d){d=new Date(d);d.setHours(12,0,0,0);const n=(d.getDay()+6)%7;d.setDate(d.getDate()-n);return d}function iso(d){return d.toISOString().slice(0,10)}function dk(d){return d.toLocaleDateString('da-DK',{day:'numeric',month:'numeric'})}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){const end=new Date(monday);end.setDate(end.getDate()+6);document.getElementById('weekLabel').textContent=dk(monday)+' – '+dk(end);status.textContent='Synkroniserer…';try{const r=await fetch(API+'?start='+iso(monday)+'&end='+iso(end));if(!r.ok)throw Error('API '+r.status);items=await r.json();status.textContent='Synkroniseret';render()}catch(e){status.textContent='Fejl: '+e.message}}function render(){const root=document.getElementById('days');root.innerHTML='';for(let i=0;i<7;i++){const d=new Date(monday);d.setDate(d.getDate()+i);const date=iso(d),rows=items.filter(x=>x.date===date);const box=document.createElement('section');box.className='day';box.innerHTML='<h2>'+names[i]+' · '+dk(d)+'</h2>'+(rows.length?rows.map(x=>'<div class="item"><div class="itemmain"><span class="time">'+esc(x.time||'')+'</span>'+esc(x.title)+' <span class="kind">'+esc(x.kind||'egen')+'</span></div><button class="remove" data-id="'+x.id+'">×</button></div>').join(''):'<div class="empty">Ingen punkter endnu</div>')+'<div class="add"><input class="input" type="time" data-time="'+date+'"><input class="input" placeholder="Tilføj punkt" data-title="'+date+'"><button class="btn primary" data-add="'+date+'">+</button></div>';root.appendChild(box)}root.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add));root.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>removeItem(b.dataset.id))}async function add(date){const title=document.querySelector('[data-title="'+date+'"]').value.trim(),time=document.querySelector('[data-time="'+date+'"]').value;if(!title)return;status.textContent='Gemmer…';const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date,time,title,kind:'egen'})});if(r.ok)load();else status.textContent='Kunne ikke gemme'}async function removeItem(id){status.textContent='Fjerner…';const r=await fetch(API+'?id='+id,{method:'DELETE'});if(r.ok)load();else status.textContent='Kunne ikke fjerne'}prev.onclick=()=>{monday.setDate(monday.getDate()-7);load()};next.onclick=()=>{monday.setDate(monday.getDate()+7);load()};load();</script></body></html>
