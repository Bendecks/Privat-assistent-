<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Privat-assistent</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#17202a;background:#f4f6f7}body{margin:0}.wrap{max-width:760px;margin:auto;padding:24px 16px 48px}h1{font-size:2rem;margin:.2rem 0}h2{font-size:1.2rem;margin:28px 0 10px}.sub{color:#667085;margin:0 0 24px}.card,.notes{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #00000008}.tag{display:inline-block;font-size:.78rem;background:#eef2f6;border-radius:999px;padding:4px 9px;margin-bottom:8px}.when{font-weight:700}.done{opacity:.55;text-decoration:line-through}label{display:flex;gap:12px;align-items:flex-start;cursor:pointer}input{width:20px;height:20px;margin-top:2px}textarea{box-sizing:border-box;width:100%;min-height:150px;resize:vertical;border:1px solid #d0d5dd;border-radius:10px;padding:12px;font:inherit;color:inherit;background:#fff}textarea:focus{outline:2px solid #98a2b3;outline-offset:1px}.save-state{font-size:.8rem;color:#667085;margin-top:8px}.footer{margin-top:24px;color:#667085;font-size:.85rem}</style></head><body><main class="wrap"><div class="tag">Privat-assistent</div><h1>Praktisk overblik</h1><p class="sub">Aktuelle opgaver fra samtalen · mandag 31. august 2026</p><section><div class="card"><label><input type="checkbox" data-id="klarna-profil-optik"><span><span class="tag">Betaling</span><br><span class="when">Snarest</span> — Åbn Klarna og betal 252 kr. til Profil Optik for at undgå rykkergebyr.</span></label></div><div class="card"><label><input type="checkbox" data-id="lasertag"><span><span class="tag">Booking</span><br>Book lasertag.</span></label></div><div class="card"><label><input type="checkbox" data-id="sackit"><span><span class="tag">Opfølgning</span><br><span class="when">Mandag</span> — Følg op med SACKit kundeservice om metalknapperne på mormors stole.</span></label></div><div class="card"><label><input type="checkbox" data-id="bent"><span><span class="tag">Opfølgning</span><br><span class="when">Mandag</span> — Følg op med Bent om strøm og stænkplade.</span></label></div><div class="card"><label><input type="checkbox" data-id="jord"><span><span class="tag">Praktisk</span><br>Fyld jord under postkassen.</span></label></div><div class="card"><label><input type="checkbox" data-id="elektriker"><span><span class="tag">Opfølgning</span><br><span class="when">Mandag</span> — Følg op på tilbud fra elektriker til strøm i skuret.</span></label></div></section><section><h2>Noter</h2><div class="notes"><textarea id="notes" placeholder="Skriv en hurtig note…" aria-label="Noter"></textarea><div class="save-state" id="saveState">Gemmes automatisk på denne enhed</div></div></section><p class="footer">Afkrydsninger og noter gemmes lokalt på enheden.</p></main><script>const k='privat-assistent-v1',s=JSON.parse(localStorage.getItem(k)||'{}');document.querySelectorAll('input[data-id]').forEach(x=>{x.checked=!!s[x.dataset.id];x.closest('.card').classList.toggle('done',x.checked);x.onchange=()=>{s[x.dataset.id]=x.checked;localStorage.setItem(k,JSON.stringify(s));x.closest('.card').classList.toggle('done',x.checked)}});const notes=document.getElementById('notes'),state=document.getElementById('saveState');notes.value=localStorage.getItem('privat-assistent-notes')||'';let t;notes.addEventListener('input',()=>{localStorage.setItem('privat-assistent-notes',notes.value);state.textContent='Gemt';clearTimeout(t);t=setTimeout(()=>state.textContent='Gemmes automatisk på denne enhed',1200)});</script></body></html>
